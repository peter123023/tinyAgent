<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Agent</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        height: 100vh;
        overflow: hidden;
      }

      #root { height: 100vh; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--scroll-thumb, #d2d2d7); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover, #b0b0b5); }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
      }

      /* Markdown styles */
      .markdown-body {
        font-size: 14px;
        line-height: 1.6;
      }
      .markdown-body p { margin-bottom: 6px; }
      .markdown-body p:last-child { margin-bottom: 0; }
      .markdown-body p:first-child {
        margin-top: 0;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.1px;
      }
      .markdown-body code {
        background: var(--md-code-bg, #f0f0f2);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 12.5px;
        font-family: 'SF Mono', Monaco, monospace;
      }
      .markdown-body pre {
        background: var(--md-pre-bg, #f0f0f2);
        padding: 10px 14px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 6px 0;
      }
      .markdown-body pre code {
        background: none;
        padding: 0;
        font-size: 12.5px;
        line-height: 1.5;
      }
      .markdown-body ul, .markdown-body ol {
        padding-left: 0;
        margin: 4px 0;
        list-style: none;
      }
      .markdown-body li {
        margin-bottom: 3px;
        padding: 4px 10px 4px 28px;
        position: relative;
        font-size: 13px;
        line-height: 1.45;
        border-radius: 6px;
        background: var(--md-li-bg, rgba(0, 0, 0, 0.02));
      }
      .markdown-body li:before {
        content: '';
        position: absolute;
        left: 10px;
        top: 10px;
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: #0066cc;
        opacity: 0.6;
      }
      .markdown-body li:last-child { margin-bottom: 0; }
      .markdown-body strong { font-weight: 600; }

      /* Sidebar hover effect */
      .sidebar-item:hover .sidebar-delete-btn { opacity: 1 !important; }

      /* Input focus */
      .input-wrapper:focus-within {
        border-color: #0066cc !important;
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
      }

      /* Button press */
      button:active {
        transform: scale(0.95);
      }

      /* Welcome chips */
      .welcome-chip:hover {
        border-color: #0066cc !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
